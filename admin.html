<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Matrix — Admin</title><style>
:root{--bg:#11110f;--panel:#191916;--panel2:#22221e;--text:#f5f3ee;--muted:#9b9992;--line:#36352f;--gold:#c9a86a;--danger:#d66b6b;--green:#78b88a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#30291d 0,transparent 30%),var(--bg);color:var(--text);font:14px Arial,sans-serif}a{color:inherit}.wrap{width:min(1400px,calc(100% - 32px));margin:auto}.top{padding:28px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font-weight:800;letter-spacing:-.06em;font-size:19px}.logo span{font-weight:400}.login{min-height:100vh;display:grid;place-items:center}.login-card,.dashboard{background:rgba(25,25,22,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px #0008}.login-card{width:min(440px,100%);padding:36px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}.login-card h1{font-size:42px;letter-spacing:-.06em;margin:12px 0}.login-card p{color:var(--muted)}input,select{width:100%;padding:14px;border:1px solid var(--line);background:#11110f;color:var(--text);border-radius:10px;outline:0;margin:8px 0 16px}button{border:0;border-radius:10px;padding:13px 17px;background:var(--text);color:#111;font-weight:700;cursor:pointer}button:hover{transform:translateY(-1px)}.error{color:#e48b8b;min-height:20px;font-size:12px}.dashboard{padding:26px;margin:32px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.toolbar{display:flex;gap:10px;align-items:center;margin:20px 0}.toolbar input{margin:0;max-width:360px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:15px 13px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:#151512}td{font-size:13px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:100px;background:#302f2a;color:#ddd;font-size:10px}.pill.new{color:#e7c986;background:#3a3221}.pill.contacted{color:#9fc8ff;background:#222f3d}.pill.completed{color:#9bd3a9;background:#203426}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:11px;background:#2b2a25;color:#fff}.actions .delete{color:#ff9b9b}.empty{text-align:center;padding:50px;color:var(--muted)}.logout{background:transparent;color:var(--muted);border:1px solid var(--line)}.message{max-width:300px;white-space:pre-wrap;color:#c5c3bc}.notice{color:var(--muted);font-size:11px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.dashboard{padding:16px}.top{align-items:flex-start;gap:15px}.top h2{font-size:18px}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}}
</style></head><body>
<div id="app"></div><script>
const app=document.getElementById('app');const KEY='wm_admin_key';let leads=[];
function login(){app.innerHTML=`<main class="login"><section class="login-card"><div class="eyebrow">WEB MATRIX / ADMIN</div><h1>Client enquiries.</h1><p>Enter your admin key to view and manage enquiries from the portfolio.</p><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><div id="err" class="error"></div><button id="loginBtn">Open Dashboard ↗</button><p class="notice">Your key is stored only in this browser session.</p></section></main>`;document.getElementById('loginBtn').onclick=()=>load(document.getElementById('key').value.trim());document.getElementById('key').onkeydown=e=>{if(e.key==='Enter')load(e.target.value.trim())}}
async function load(key){if(!key)return;document.getElementById('err').textContent='Checking…';try{const r=await fetch('/api/leads',{headers:{'x-admin-key':key}});if(!r.ok)throw new Error('Invalid admin key.');const d=await r.json();sessionStorage.setItem(KEY,key);leads=d.leads||[];render();}catch(e){document.getElementById('err').textContent=e.message}}
async function refresh(){const key=sessionStorage.getItem(KEY);if(!key)return login();const r=await fetch('/api/leads',{headers:{'x-admin-key':key}});if(r.status===401){sessionStorage.removeItem(KEY);return login()}const d=await r.json();leads=d.leads||[];render()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const counts={New:0,Contacted:0,Completed:0};leads.forEach(x=>counts[x.status||'New']++);app.innerHTML=`<div class="wrap"><header class="top"><div><div class="logo">WEB <span>MATRIX</span></div><div class="notice">Freelance portfolio / lead management</div></div><button class="logout" id="logout">Log out</button></header><main class="dashboard"><div class="eyebrow">CLIENT PIPELINE</div><h2 style="font-size:34px;letter-spacing:-.05em;margin:10px 0">Project enquiries</h2><p class="notice">Manage leads submitted through the Web Matrix contact form.</p><section class="stats"><div class="stat"><b>${leads.length}</b><span>Total enquiries</span></div><div class="stat"><b>${counts.New}</b><span>New</span></div><div class="stat"><b>${counts.Contacted}</b><span>Contacted</span></div><div class="stat"><b>${counts.Completed}</b><span>Completed</span></div></section><div class="toolbar"><input id="search" placeholder="Search client, business, email…"><button id="refresh">Refresh ↻</button></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Contact</th><th>Project</th><th>Message</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>`;document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(KEY);login()};document.getElementById('refresh').onclick=refresh;document.getElementById('search').oninput=e=>drawRows(e.target.value);drawRows('')}
function drawRows(q){const rows=document.getElementById('rows');q=q.toLowerCase();const filtered=leads.filter(x=>[x.name,x.business,x.email,x.whatsapp,x.type,x.message].join(' ').toLowerCase().includes(q));if(!filtered.length){rows.innerHTML='<tr><td colspan="7" class="empty">No enquiries found.</td></tr>';return}rows.innerHTML=filtered.map(x=>{const status=x.status||'New';const phone=(x.whatsapp||'').replace(/\D/g,'');return `<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.business)}</span></td><td><a href="mailto:${esc(x.email)}">${esc(x.email)}</a><br><span class="muted">${esc(x.whatsapp||'No WhatsApp')}</span></td><td><span class="pill">${esc(x.type)}</span></td><td><div class="message">${esc(x.message||'—')}</div></td><td class="muted">${new Date(x.created_at).toLocaleString()}</td><td><span class="pill ${status.toLowerCase()}">${esc(status)}</span></td><td><div class="actions">${phone?`<button onclick="window.open('https://wa.me/${phone}','_blank')">WhatsApp</button>`:''}<button onclick="setStatus(${x.id},'New')">New</button><button onclick="setStatus(${x.id},'Contacted')">Contacted</button><button onclick="setStatus(${x.id},'Completed')">Done</button><button class="delete" onclick="removeLead(${x.id})">Delete</button></div></td></tr>`}).join('')}
async function setStatus(id,status){const key=sessionStorage.getItem(KEY);const r=await fetch('/api/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status})});if(r.ok)refresh();else alert('Could not update status.')}
async function removeLead(id){if(!confirm('Delete this enquiry permanently?'))return;const key=sessionStorage.getItem(KEY);const r=await fetch('/api/leads/'+id,{method:'DELETE',headers:{'x-admin-key':key}});if(r.ok)refresh();else alert('Could not delete enquiry.')}
if(sessionStorage.getItem(KEY))refresh();else login();
</script></body></html>
